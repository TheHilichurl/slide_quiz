<!-- ==========================================================================
     MANDATORY HEADER (Place inside every <section class="slide">)
     ========================================================================== -->
<header class="slide-header">
  <div class="header-left">
    <!-- University Slogan: Bold, Uppercase, 18-22px, Primary Brand Orange -->
    <div class="brand-slogan">HỌC ĐỂ THAY ĐỔI</div>
    <!-- Section / Chapter Breadcrumb Badge -->
    <div class="header-topic-badge">
      <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i>
      GDQP-AN • BỘ MÔN QUÂN SỰ
    </div>
  </div>
  <div class="header-right">
    <!-- Official Dai Nam University Horizontal Logo -->
    <img src="assets/dai-nam-logo-ngang.svg" alt="Trường Đại học Đại Nam" class="official-logo-img">
  </div>
</header>

<!-- ==========================================================================
     MANDATORY FOOTER (Place inside every <section class="slide">)
     ========================================================================== -->
<footer class="slide-footer">
  <div class="footer-left">
    <!-- Live Presentation Timer (starts counting up when navigating away from slide 1) -->
    <div class="footer-timer-display">
      <i data-lucide="clock" style="width: 18px; height: 18px;"></i>
      <span class="timer-text">00:00</span>
    </div>
    <!-- Clickable Official University Website -->
    <a href="https://dainam.edu.vn" target="_blank" rel="noopener noreferrer" class="footer-dnu-link">
      <i data-lucide="external-link" style="width: 16px; height: 16px;"></i>
      dainam.edu.vn
    </a>
  </div>
  <!-- Fixed Metadata Pill (Group, Squad, Platoon, Company, Subject) -->
  <div class="footer-center">
    <span class="footer-meta-pill">Nhóm 1</span> | Tiểu đội 1 | Trung đội 1 | Đại đội 6 | Môn: GDQP-AN
  </div>
  <!-- Dynamic Slide Counter (Current / Total) -->
  <div class="footer-right">
    <div class="slide-counter"><span class="current-num">01</span> / 10</div>
  </div>
</footer>
